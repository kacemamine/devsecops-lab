name: Commit Lint

on:
  pull_request:

jobs:
  commit-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          bad=$(git log --no-merges --format=%s "${{ github.event.pull_request.base.sha }}..${{ github.sha }}" \
          | grep -Ev '^(feat|fix|docs|chore|refactor|test|ci|security)(\([a-z0-9-]+\))?: .+ \(#[0-9]+\)$' || true)

          if [ -n "$bad" ]; then
            echo "Non-compliant commits:"
            echo "$bad"
            exit 1
          fi
